    acc_lim_y: 0.0
    acc_lim_theta: 3.2
    decel_lim_x: -2.5
    decel_lim_y: 0.0
    decel_lim_theta: -3.2
    vx_samples: 20
    vy_samples: 5
    vtheta_samples: 20
    sim_time: 1.7
    linear_granularity: 0.05
    angular_granularity: 0.025
    transform_tolerance: 0.2
    xy_goal_tolerance: 0.25
    trans_stopped_velocity: 0.25
    short_circuit_trajectory_evaluation: true
    stateful: true
    critics:
    - RotateToGoal
    - Oscillation
    - BaseObstacle
    - GoalAlign
    - PathAlign
    - PathDist
    - GoalDist
    BaseObstacle.scale: 0.02
    PathAlign.scale: 32.0
    PathAlign.forward_point_distance: 0.1
    GoalAlign.scale: 24.0
    GoalAlign.forward_point_distance: 0.1
    PathDist.scale: 32.0
    GoalDist.scale: 24.0
    RotateToGoal.scale: 32.0
    RotateToGoal.slowing_factor: 5.0
    RotateToGoal.lookahead_time: -1.0
  new:
    plugin: smartcar_nav_checks::AckermannRPP
    min_turning_radius: 0.6
    terminal_extension: 0.45
    terminal_slowdown_distance: 0.6
    terminal_speed_gain: 0.7
    desired_linear_vel: 0.32
    lookahead_dist: 0.5
    min_lookahead_dist: 0.3
    max_lookahead_dist: 0.65
    lookahead_time: 1.2
    use_velocity_scaled_lookahead_dist: true
    transform_tolerance: 0.5
    min_approach_linear_velocity: 0.035
    approach_velocity_scaling_dist: 0.8
    use_collision_detection: true
    max_allowed_time_to_collision_up_to_carrot: 2.0
    use_regulated_linear_velocity_scaling: true
    use_cost_regulated_linear_velocity_scaling: true
    regulated_linear_scaling_min_radius: 0.85
    regulated_linear_scaling_min_speed: 0.08
    cost_scaling_dist: 0.3
    cost_scaling_gain: 1.0
    inflation_cost_scaling_factor: 3.0
    use_rotate_to_heading: false
    allow_reversing: true
    max_angular_accel: 1.0
  reason: AckermannRPP bounds curvature before collision prediction and extends terminal
    heading reference; real Nav2 goal remains unchanged
