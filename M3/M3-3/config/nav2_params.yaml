# amcl/ros__parameters/laser_max_range: Match physical simulated laser range
# amcl/ros__parameters/laser_min_range: Reject below laser minimum
# amcl/ros__parameters/max_particles: Bound VM CPU
# amcl/ros__parameters/min_particles: Bound VM CPU
# amcl/ros__parameters/sigma_hit: Laser sigma .01m; include grid uncertainty
# amcl/ros__parameters/update_min_a: Car turning updates
# amcl/ros__parameters/update_min_d: Dense updates through 1m gate
# amcl/ros__parameters/set_initial_pose: Known surveyed start; never read Gazebo truth for localization
# amcl/ros__parameters/initial_pose/x: Map start at world (1,1)
# amcl/ros__parameters/initial_pose/y: Map start at world (1,1)
# amcl/ros__parameters/initial_pose/z: Map start at world (1,1)
# amcl/ros__parameters/initial_pose/yaw: Map start at world (1,1)
# bt_navigator/ros__parameters/robot_base_frame: Ground projection for planar navigation
# bt_navigator/ros__parameters/default_nav_to_pose_bt_xml: Resolved by bringup per checkout; recovery excludes impossible in-place spin
# bt_navigator/ros__parameters/default_nav_through_poses_bt_xml: Resolved by bringup per checkout; both navigator BTs exclude unavailable spin action
# controller_server/ros__parameters/failure_tolerance: Allow2s of transient unavailable local control while periodic global replanning can respond.
# controller_server/ros__parameters/progress_checker/required_movement_radius: Slow .15m progress remains valid during obstacle approach.
# controller_server/ros__parameters/progress_checker/movement_time_allowance: Allow20s to make measurable progress; the external trial timeout remains bounded.
# controller_server/ros__parameters/general_goal_checker/stateful: False documents joint XY/yaw checking; the custom checker always checks both and rejects invalid poses.
# controller_server/ros__parameters/general_goal_checker/plugin: Reject invalid transformed goal quaternion; prevents observed Humble premature success after TF failure
# controller_server/ros__parameters/general_goal_checker/xy_goal_tolerance: Internal .05m leaves map-grid and localization margin inside the independent .15m truth limit.
# controller_server/ros__parameters/general_goal_checker/yaw_goal_tolerance: Internal .10rad leaves margin inside the independent .20rad truth limit.
# controller_server/ros__parameters/FollowPath/plugin: AckermannRPP bounds curvature before collision prediction and extends terminal heading reference; real Nav2 goal remains unchanged
# controller_server/ros__parameters/FollowPath/min_turning_radius: Clamp curvature before prediction; .60m exceeds the car geometric inner-wheel limit of about .575m.
# controller_server/ros__parameters/FollowPath/terminal_extension: Virtual .45m heading reference improves terminal alignment; ControllerServer still checks the original goal.
# controller_server/ros__parameters/FollowPath/terminal_slowdown_distance: Start actual-goal speed limiting within .60m; the virtual reference must not cause overshoot.
# controller_server/ros__parameters/FollowPath/terminal_speed_gain: Inside the terminal region cap |v| by max(approach floor, .7*distance), preserving an already lower safe speed.
# controller_server/ros__parameters/FollowPath/desired_linear_vel: Nominal cruise .32m/s balances traversal time, clearance and command variation; aggressive comparison is .65m/s.
# controller_server/ros__parameters/FollowPath/lookahead_dist: Nominal reference distance; velocity scaling and min/max bounds determine the actual carrot.
# controller_server/ros__parameters/FollowPath/min_lookahead_dist: Lower bound avoids chasing laser/localization noise at near-zero speed.
# controller_server/ros__parameters/FollowPath/max_lookahead_dist: Upper bound limits corner cutting in the narrow ring corridors.
# controller_server/ros__parameters/FollowPath/lookahead_time: Scale the reference distance from measured forward/reverse speed before clamping to .30-.65m.
# controller_server/ros__parameters/FollowPath/use_velocity_scaled_lookahead_dist: Adapt tracking distance to measured speed; fixed short lookahead is reserved for the aggressive comparison.
# controller_server/ros__parameters/FollowPath/transform_tolerance: AckermannRPP bounds curvature before collision prediction and extends terminal heading reference; real Nav2 goal remains unchanged
# controller_server/ros__parameters/FollowPath/min_approach_linear_velocity: A .035m/s floor prevents numerical stall; the terminal cap never accelerates a lower safe command.
# controller_server/ros__parameters/FollowPath/approach_velocity_scaling_dist: Keep inherited RPP approach regulation; additional terminal regulation uses the actual goal, not the virtual endpoint.
# controller_server/ros__parameters/FollowPath/use_collision_detection: Retain footprint checks on the bounded command; never rely only on bridge clipping.
# controller_server/ros__parameters/FollowPath/max_allowed_time_to_collision_up_to_carrot: Predict feasible chassis arcs for up to2s, bounded by the current tracking/stopping region.
# controller_server/ros__parameters/FollowPath/use_regulated_linear_velocity_scaling: Reduce cruise speed when reference curvature becomes tight.
# controller_server/ros__parameters/FollowPath/use_cost_regulated_linear_velocity_scaling: Reduce speed near obstacle inflation costs.
# controller_server/ros__parameters/FollowPath/regulated_linear_scaling_min_radius: Begin speed regulation before reaching the .60m physical curvature bound.
# controller_server/ros__parameters/FollowPath/regulated_linear_scaling_min_speed: Inherited regulation floor; terminal approach may command lower speeds.
# controller_server/ros__parameters/FollowPath/cost_scaling_dist: Proximity band for cost-based speed regulation, separate from footprint collision checks.
# controller_server/ros__parameters/FollowPath/cost_scaling_gain: Keep cost regulation proportional rather than adding an unmeasured extra gain.
# controller_server/ros__parameters/FollowPath/inflation_cost_scaling_factor: Match the actual costmap inflation-layer decay factor.
# controller_server/ros__parameters/FollowPath/use_rotate_to_heading: False: an Ackermann chassis cannot execute an in-place rotation.
# controller_server/ros__parameters/FollowPath/allow_reversing: True: match Reeds-Shepp path inversions and the negative smoother velocity bound.
# controller_server/ros__parameters/FollowPath/max_angular_accel: Inherited rotate-only RPP parameter is inactive in this Ackermann branch; the external smoother bounds angular acceleration.
# local_costmap/local_costmap/ros__parameters/robot_base_frame: Rear-axle midpoint, matching controller kinematics
# local_costmap/local_costmap/ros__parameters/width: See turn before entering it
# local_costmap/local_costmap/ros__parameters/height: See turn before entering it
# local_costmap/local_costmap/ros__parameters/plugins: 2D laser; avoid needless voxel projection
# local_costmap/local_costmap/ros__parameters/inflation_layer/inflation_radius: Soft .45m cost field improves corner clearance without treating the full radius as a lethal band.
# local_costmap/local_costmap/ros__parameters/footprint: Unchanged .45x.22m body centered .14m ahead; .26m envelope includes steered wheels
# local_costmap/local_costmap/ros__parameters/footprint_padding: Add .08m planning margin around the unchanged physical envelope; independent evaluation does not shrink its footprint.
# local_costmap/local_costmap/ros__parameters/obstacle_layer/plugin: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/enabled: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/observation_sources: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/topic: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/max_obstacle_height: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/clearing: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/marking: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/data_type: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/raytrace_max_range: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/raytrace_min_range: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/obstacle_max_range: Use actual 8m laser for obstacle marking/clearing
# local_costmap/local_costmap/ros__parameters/obstacle_layer/scan/obstacle_min_range: Use actual 8m laser for obstacle marking/clearing
# global_costmap/global_costmap/ros__parameters/robot_base_frame: Rear-axle midpoint, matching controller kinematics
# global_costmap/global_costmap/ros__parameters/obstacle_layer/scan/raytrace_max_range: Use actual 8m laser for obstacle marking/clearing
# global_costmap/global_costmap/ros__parameters/obstacle_layer/scan/raytrace_min_range: Use actual 8m laser for obstacle marking/clearing
# global_costmap/global_costmap/ros__parameters/obstacle_layer/scan/obstacle_max_range: Use actual 8m laser for obstacle marking/clearing
# global_costmap/global_costmap/ros__parameters/obstacle_layer/scan/obstacle_min_range: Use actual 8m laser for obstacle marking/clearing
# global_costmap/global_costmap/ros__parameters/inflation_layer/inflation_radius: Soft .45m cost field improves corner clearance without treating the full radius as a lethal band.
# global_costmap/global_costmap/ros__parameters/footprint: Unchanged .45x.22m body centered .14m ahead; .26m envelope includes steered wheels
# global_costmap/global_costmap/ros__parameters/footprint_padding: Add .08m planning margin around the unchanged physical envelope; independent evaluation does not shrink its footprint.
# planner_server/ros__parameters/expected_planner_frequency: Match 1Hz BT replan instead of default20
# planner_server/ros__parameters/GridBased/plugin: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/tolerance: Planner fallback search tolerance is separate from the strict physical-goal validation; an approximate endpoint cannot pass if truth limits fail.
# planner_server/ros__parameters/GridBased/downsample_costmap: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/allow_unknown: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/max_iterations: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/max_on_approach_iterations: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/max_planning_time: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/motion_model_for_search: Reeds-Shepp explicitly supports feasible forward/reverse car maneuvers.
# planner_server/ros__parameters/GridBased/angle_quantization_bins: 72 heading bins give5deg search resolution; this is not a precision claim.
# planner_server/ros__parameters/GridBased/analytic_expansion_ratio: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/analytic_expansion_max_length: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/minimum_turning_radius: Hybrid-A* radius .65m leaves margin above controller/chassis .60m bound.
# planner_server/ros__parameters/GridBased/reverse_penalty: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/change_penalty: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/non_straight_penalty: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/cost_penalty: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/retrospective_penalty: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/lookup_table_size: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/cache_obstacle_heuristic: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# planner_server/ros__parameters/GridBased/smooth_path: Hybrid-A* Reeds-Shepp plans forward/reverse Ackermann maneuvers with radius .65m
# behavior_server/ros__parameters/behavior_plugins: No spin behavior for car
# velocity_smoother/ros__parameters/max_velocity: Shared envelope for controlled profiles; nominal RPP cruise remains .32m/s and chassis clamps curvature
# velocity_smoother/ros__parameters/min_velocity: Allow bounded reverse commands consistently with planner and controller
# velocity_smoother/ros__parameters/max_accel: Reduce tire slip on velocity changes
# velocity_smoother/ros__parameters/max_decel: Controlled braking
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.12
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 1000
    min_particles: 300
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.05
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
    default_nav_to_pose_bt_xml: M3/M3-3/config/car_navigation.xml
    default_nav_through_poses_bt_xml: M3/M3-3/config/car_through_poses.xml
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: false
      plugin: smartcar_nav_checks::ValidPoseGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.1
    FollowPath:
      plugin: smartcar_nav_checks::AckermannRPP
      min_turning_radius: 0.6
      terminal_extension: 0.45
      terminal_slowdown_distance: 0.6
      terminal_speed_gain: 0.7
      desired_linear_vel: 0.32
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.65
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.035
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.85
      regulated_linear_scaling_min_speed: 0.08
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: false
      allow_reversing: true
      max_angular_accel: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.22
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      footprint: '[[0.365,0.13],[0.365,-0.13],[-0.085,-0.13],[-0.085,0.13]]'
      footprint_padding: 0.08
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 7.8
          obstacle_min_range: 0.12
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 7.8
          obstacle_min_range: 0.12
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      footprint: '[[0.365,0.13],[0.365,-0.13],[-0.085,-0.13],[-0.085,0.13]]'
      footprint_padding: 0.08
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.65
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.75
    - 0.0
    - 1.2
    min_velocity:
    - -0.2
    - 0.0
    - -0.9
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -0.7
    - 0.0
    - -1.0
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
